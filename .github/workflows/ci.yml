name: CI
on: 
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24.11 is the last 24.x without the require(esm) fix from
        # https://github.com/nodejs/node/pull/60380, which a bare `24` now resolves
        # past. Pinned so the async hooks stay covered on a 24.x that still crashes if
        # they hand `source` back for CommonJS, alongside 20 and 22.
        node-version: [20, 22, 24.11, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }} 
      - name: Install Dependencies
        run: npm install
      - name: Run Tests
        run: npm test


